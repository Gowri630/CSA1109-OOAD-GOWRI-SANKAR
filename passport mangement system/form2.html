<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form 2 - Address Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="step">Step 2 of 3</div>
    <h1>Form 2: Address Details</h1>
    <p class="subtitle">Enter the applicant's contact and address information.</p>
    <form id="form2">
      <label for="email">Email address</label><input id="email" name="email" type="email" required>
      <label for="phone">Phone number</label><input id="phone" name="phone" type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required>
      <label for="address">Full address</label><textarea id="address" name="address" rows="3" required></textarea>
      <div class="grid">
        <div><label for="city">City</label><input id="city" name="city" required></div>
        <div><label for="state">State</label><input id="state" name="state" required></div>
        <div><label for="pincode">PIN code</label><input id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6" required></div>
      </div>
      <div class="actions"><a class="button secondary" href="form1.html">Previous</a><button type="submit">Save & Continue</button></div>
      <p id="form2Message" class="message"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
