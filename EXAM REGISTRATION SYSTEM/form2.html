<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Registration Portal - Form 2</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><div class="step">Step 2 of 3</div><h1>Form 2: Contact Details</h1><p class="subtitle">Enter the candidate's contact information.</p><form id="form2"><div class="grid"><div><label for="email">Email address</label><input id="email" name="email" type="email" required></div><div><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required></div><div class="full"><label for="address">Address</label><textarea id="address" name="address" rows="3" required></textarea></div></div><div class="actions"><a class="button secondary" href="form1.html">Previous</a><button type="submit">Save &amp; Continue</button></div><p id="form2Message" class="message"></p></form></main><script src="script.js"></script></body></html>
